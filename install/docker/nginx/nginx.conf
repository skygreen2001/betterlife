server {
    listen 80 default_server;
    server_name localhost;
    server_name 127.0.0.1;
    root /var/www/html/betterlife/;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # 禁止 upload、log 目录下的可执行脚本被解析执行，命中直接返回 403
    # 说明: 正则 location (~*) 优先级高于普通前缀 location (/);
    #       同为正则 location 时按配置出现顺序匹配，因此该规则必须放在下方 \.php$ 规则之前
    # 作用范围: 仅限 /upload、/log 两个目录下指定后缀的文件，其他目录与静态资源不受影响
    location ~* ^/(upload|log)/.*\.(php|phtml|php[0-9]|phps|pht|phar|asp|aspx|asa|cer|jsp|jspx|sh|py|cgi|pl|shtml)$ {
        return 403;
    }
    # location ~* \.php$ {
    location ~ .*\.php(\/.*)*$ {
        #include snippets/fastcgi-php.conf;
        # try_files $uri = 404;
        # fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # fastcgi_pass unix:/run/php/php7.0-fpm.sock;
        fastcgi_pass bb:9000;
        include      fastcgi.conf;
        # fastcgi_index index.php;
        # include fastcgi_params;
        # include fastcgi_cache;
    }
}